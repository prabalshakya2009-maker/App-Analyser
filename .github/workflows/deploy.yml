// filepath: .github/workflows/deploy.yml
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate, Install & Build Frontend
        run: |
          PKG_FILE=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "Error: package.json not found in repository."
            find . -maxdepth 3
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_FILE")
          echo "Found frontend at: $APP_DIR"
          cd "$APP_DIR"
          npm install
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/_site"
          cp -r dist/* "$GITHUB_WORKSPACE/_site/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4